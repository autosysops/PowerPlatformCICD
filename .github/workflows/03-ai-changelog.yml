name: Demo 3 - AI changelog

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Solutions/**'

jobs:
  create-changelog:
    runs-on: ubuntu-latest
    steps:
      # Fetch the full history, we need the old version of the solution to compare with
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      # In a pull request we compare with the target branch, a manual run compares with the previous commit
      - name: Generate changelog
        shell: pwsh
        env:
          # Fine-grained personal access token with the "Copilot Requests" permission
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: ./Scripts/03-New-Changelog.ps1 -BaseRef '${{ github.event.pull_request.base.sha || 'HEAD~1' }}'

      - name: Publish changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: Docs/CHANGELOG.md
