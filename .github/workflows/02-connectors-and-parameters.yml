name: Demo 2 - Connectors and parameters

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Solutions/**'

jobs:
  check-connectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PowerPlatformChecker
        shell: pwsh
        run: Install-Module -Name PowerPlatformChecker -Scope CurrentUser -Force

      - name: Check connectors, parameters and descriptions
        shell: pwsh
        run: ./Scripts/02-Test-ConnectorsAndParameters.ps1
