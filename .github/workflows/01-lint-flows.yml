name: Demo 1 - Lint the flows

# Run manually from the Actions tab, or automatically when a pull request changes a solution
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Solutions/**'

jobs:
  lint-flows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PowerPlatformChecker
        shell: pwsh
        run: |
          Install-Module -Name PowerPlatformChecker -Scope CurrentUser -Force
          Get-InstalledModule -Name PowerPlatformChecker, TelemetryHelper | Format-Table Name, Version

      - name: Lint flows
        shell: pwsh
        run: ./Scripts/01-Test-Flows.ps1
