name: Demo 2 - Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Solutions/**'

jobs:
  create-documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PowerPlatformChecker
        shell: pwsh
        run: |
          # 1.3.0 adds Convert-PowerPlatformCheckerFlowChartGraphToMermaid
          Install-Module -Name PowerPlatformChecker -MinimumVersion 1.3.0 -Scope CurrentUser -Force
          Get-InstalledModule -Name PowerPlatformChecker, TelemetryHelper | Format-Table Name, Version

      - name: Generate documentation
        shell: pwsh
        run: ./Scripts/02-New-Documentation.ps1

      # The markdown files can be downloaded from the run page
      - name: Publish documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: Docs
